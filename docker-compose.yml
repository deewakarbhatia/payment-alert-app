services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - JWT_SECRET=mysecretkey123
      - FAST2SMS_API_KEY=your_api_key_here
    networks:
      - appnet

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet: